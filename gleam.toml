name = "memory"
version = "0.1.0"
target = "javascript"
description = "Typed wiki memory shared across Claude Code, Codex, and OpenCode"
repository = { type = "github", user = "MrVampy", repo = "memory-plugin" }

[javascript]
runtime = "nodejs"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
simplifile = ">= 2.0.0 and < 3.0.0"
argv = ">= 1.0.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
